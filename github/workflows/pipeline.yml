name: Daily data pipeline

on:
    schedule:
    -cron: "06***"

workflow_dispatch:

jobs: 
    run-pipeline:
        runs-on: ubuntu-latest
    
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          
        - name: Set up Python
          uses: actions/setup-python@v5
          with:
              python-version: "3.11"
              
        - name: Install uv
          uses: astral-sh/setup-uv@v3
          
          -name: Install dependencies
           run: | uv sync
           
           -name: Run pipeline
           run: | uv run python main.py

        

    

    
    